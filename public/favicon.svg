<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#1B1D22" />
  
  <!-- Woven Warp & Weft Grid Graphic -->
  <g stroke="#F3F3EF" stroke-width="28" stroke-linecap="round">
    <!-- Warp Threads (Vertical) -->
    <line x1="160" y1="110" x2="160" y2="402" stroke="#B23A2E" />
    <line x1="256" y1="110" x2="256" y2="402" stroke="#D9A21B" />
    <line x1="352" y1="110" x2="352" y2="402" stroke="#26357A" />

    <!-- Weft Threads (Horizontal Interlacing) -->
    <line x1="110" y1="180" x2="402" y2="180" stroke="#F3F3EF" />
    <line x1="110" y1="276" x2="402" y2="276" stroke="#4C6B3A" />
    <line x1="110" y1="372" x2="402" y2="372" stroke="#F3F3EF" />
  </g>

  <!-- Small center interlacing highlight -->
  <circle cx="256" cy="276" r="14" fill="#F3F3EF" />
</svg>
